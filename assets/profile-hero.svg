<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Basil Khowaja — Software Engineer</title>
  <desc id="desc">A dynamic developer profile banner with an animated systems grid, circuit paths, and code traces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#060b18"/>
      <stop offset=".48" stop-color="#101b35"/>
      <stop offset="1" stop-color="#063d47"/>
    </linearGradient>
    <radialGradient id="halo" cx="78%" cy="38%" r="58%">
      <stop offset="0" stop-color="#32d4c8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#32d4c8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#72e6db" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1400" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="26" fill="url(#grid)"/>
  <rect width="1400" height="420" rx="26" fill="url(#halo)"/>

  <g opacity=".7">
    <circle cx="1120" cy="106" r="98" fill="#3fe0d3" fill-opacity=".15" filter="url(#soft)"/>
    <circle cx="1245" cy="290" r="132" fill="#2c7cff" fill-opacity=".14" filter="url(#soft)"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M875 86H1010l38 38h128l58 58h124" stroke="#46e1d4" stroke-opacity=".45" stroke-width="2" stroke-dasharray="9 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-152" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M780 322h120l44-44h174l44-44h196" stroke="#5ba8ff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="0" to="160" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M1028 52v52l50 50v58l44 44" stroke="#79f0e4" stroke-opacity=".35" stroke-width="1.5"/>
    <path d="M1318 146h-76l-34 34v64" stroke="#79f0e4" stroke-opacity=".35" stroke-width="1.5"/>
  </g>

  <g fill="#71e7db" filter="url(#glow)">
    <circle cx="1010" cy="86" r="5"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1122" cy="212" r="5"><animate attributeName="opacity" values="1;.22;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1234" cy="182" r="5"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="944" cy="278" r="5"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <g opacity=".36" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#9cece5">
    <text x="875" y="205">status: building</text>
    <text x="1040" y="243">system.online()</text>
    <text x="1148" y="344">packet → secure</text>
    <text x="896" y="120">0xBASIL</text>
  </g>

  <g transform="translate(86 90)">
    <rect x="0" y="0" width="142" height="34" rx="17" fill="#45e2d5" fill-opacity=".15" stroke="#65e9df" stroke-opacity=".45"/>
    <circle cx="20" cy="17" r="5" fill="#68eadf" filter="url(#glow)"/>
    <text x="36" y="22" fill="#a8fff8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" letter-spacing="1.8">SYSTEMS</text>
    <text x="0" y="111" fill="#f6fbff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="1">BASIL KHOWAJA</text>
    <text x="3" y="156" fill="#b7cde5" font-family="Arial, Helvetica, sans-serif" font-size="24">Software Engineer <tspan fill="#58e4d8">·</tspan> Cybersecurity Explorer <tspan fill="#58e4d8">·</tspan> Cloud Builder</text>
    <path d="M3 194h550" stroke="#65e9df" stroke-opacity=".45" stroke-width="2"/>
    <text x="3" y="234" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">$</text>
    <text x="28" y="234" fill="#d8e7f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">building ideas into software_</text>
  </g>

  <path d="M0 376C240 334 446 438 690 382s426-16 710-60v98H0z" fill="#07101f" fill-opacity=".54"/>
  <rect x="1" y="1" width="1398" height="418" rx="25" fill="none" stroke="#8cf1e8" stroke-opacity=".16"/>
</svg>